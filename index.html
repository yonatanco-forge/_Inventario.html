<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <tittle>Iniciar Sesion Inventario ADSO</tittle>
    <link href="css/estilos.css" rel="stylesheet"><!--llama los estilos personalizados-->

</head>
<body class="login-fondo">
    <main class="login-card"><!--contenido principal de la pagina-->
        <header class="login-encabezado"><!--encabezado del login-->
            <!--Icono de la tienda-->
            <i class="bi bi-shop display-4 text-sena"></i>
            <h1 class="h3 fw-bold">Inventario Sena</h1>
            <p class="text-secondario mb-0">Ingresa tus credenciales para continuar</p>
        </header>

        <form action="dashboard.html" method="get">
            <!--form permite crear el contenido de un formulario cuando se envia y nos lleva a la ruta-method nos envia la informacion por get-->
            <div class="form-floating mb-3"><!--Argupar un contenido en un contenedor-->
                <input type="email" class="form-control" id="correo" placeholder="Sena@correo.com" required><!--type obliga que tenga el arroba(@), placeholder es el texto de ejemplo-required es que es un campo obligatorio-->
                <label for="correo"><i class="bi bi-evelope me-1"></i>Correo Electronico</label><!--Es una etiqueta de texto con que con el for conecta con el input-->
            </div>
            <div class="form-floating mb-3"><!--Agrupar un contenido en un contenedor-->
                <input type="password" id="clave" placeholder="Minimo 6 caracteres" minlenght="6" required><!--password ocula lo que escribes, minlenght=6 exige al menos 6 caracteres-->
                <label for="clave"><i class="bi bi-lock me-1"></i>Contraseña</label>                
            </div>
            <div class="d-flex justify-content-between align-tiems-center mb-4">
                <div class="form-check">
                <input class="form-check-input" type="checkbox" id="recordar"><!--type checkbox es casilla dee verificacion-->
                <label class="form-check-label" for="recordar">Recuerdame</label>
            </div>
            <a href="#" class="small text-decoration-none">Olvidó su contraseña</a>
        </div>

            <button type="submit" class="btn btn-sena w-100 py-2 fw-semibold">
                <i class="bi bi-box-arrow-in-right me-1">Ingresar</i>
            </button><!--button es para enviar el formulario antes revisa los campos required email y minlenght-->
        </form>
        <p class="login-pie">¿notienes cuenta? <a href="registro.html" class="text-decoration-none">Registrate</a></p>
        <footer class="login-pie"> 2026 SENA - ADSO Mixto</footer><!--pie de pagina-->
    </main>
</body>
</html>
