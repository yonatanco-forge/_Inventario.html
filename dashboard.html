<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesion Inventario ADSO</title>
    <!--CSS de Bootstrap 5.3.3 desde url predeterminada-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!--libreria de iconos de Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="css/estilos.css" rel="stylesheet"><!--llama los estilos personalizados-->
</head>
<body class="bg-body-tertiary">
    <!--Menu lateral-->
    <!--offcanvas en pantallas menores al lg es un panel oculto que se desliza-->
    <!--desde el lg se muestra normal. offcanvas-start lo hace salir por la izquierda . sidebar es muestra la clase el id el boton q lo abre-->
    <aside class="offcanvas-lg offcanvas-start sidebar" tabindex="-1" id="menuLateral" aria-labelledby="tituloMenu">
        <!--Encabezado del panel; bootstrap solo lo muestra en celular-->
        <div class="offcanvas-header border-bottom border-secondary">
            <!--Nombre del sistema en el panel movil-->
            <h5 class="offcanvas-tittle" id="tituloMenu"><i class="bi bi-shop me-2"></i>Tienda sena</h5>
            <!--Boton X blanco de ceirre del panel-->
            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas" data-bs-target="#menuLateral" aria-label="Cerrar menu"></button>
            <!--Cierra el encabezado-->
        </div>
        <!--Cuerpo del menu flexbox en columna para apilar logo enlaces y boton de salida-->
        <div class="offcanvas-body d-flex flex-column p-3">
            <!--logo solo se ve en computador-->
            <a href="dashboard.html" class="d-none d-lg-flex align-items-center mb-3 text-white text-decoration-none fs-5 fw-bold">
                <!--Icono verde y nombre-->
                <i class="bi bi-shop me-2 text-sena"></i>Tienda sena
                <!--Cierra el logo-->
            </a>
            <!--lista de navegacion en columna (flex-column) .nav-pills da forma de pildora al enlace activo mb-auto empuja lo que sigue hasta el fondo-->
            <ul class="nav nav-pills flex-column mb-auto">
                <!--Enlace al dashboard active lo resalta en verde y aria-current="page" avisa a los lectores de pantalla que es la pagina actual en cada modulo el active pasa su propio enlace-->
                <li class="nav-item"><a href="dashboard.html" class="nav-link active" aria-current="page"><i class="bi bi-speedometer2 me-2"></i>Dashboard</a></li>
                <!--Enlace a modulo usuarios-->
                <li class="nav-item"><a href="usuarios.html" class="nav-link"><i class="bi bi-people me-2"></i>Usuarios</a></li>
                <!--Link categoria-->
                <li class="nav-item"><a href="categorias.html" class="nav-link"><i class="bi bi-tags me-2"></i>Categorias</a></li>
                <li class="nav-item"><a href="subcategoria.html" class="nav-link"><i class="bi bi-diagram-3 me-2"></i>Subcategorias</a></li>
                <li class="nav-item"><a href="productos.html" class="nav-link"><i class="bi bi-box-seam me-2"></i>Productos</a></li>
            </ul>
            <hr>
            <!--boton que vuelve al login asi se cierra la sesion-->
            <a href="index.html" class="btn btn-outline-light btn-sm"><i class="bi bi-box-arrow-left me-1"></i>Cerrar Sesion</a>
        </div>
    </aside>
</body>
